[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slab-sweep"
version = "0.1.0"
description = "Headless, manifest-driven orchestration core for mass-movement simulation sweeps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "ALMO" }]
dependencies = [
    "numpy>=1.24",
    # Physical-core detection for the sweep's default concurrency (default_max_workers); the
    # scheduler degrades gracefully to the logical count if it is missing at runtime.
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slab_sweep = ["py.typed"]

# ---------------------------------------------------------------------------
# Quality gates
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Analyse against 3.12 -- QGIS's Qt6 interpreter and our deployment target. Runtime support
# for 3.11 is guaranteed by the CI pytest matrix, not by the type checker. 3.12 is also
# required to parse numpy's PEP 695 (`type` statement) stubs.
python_version = "3.12"
strict = true
packages = ["slab_sweep"]
mypy_path = "src"

# psutil ships no type information; treat its (optional) import as untyped rather than an error,
# whether it is installed-but-untyped locally or absent in a minimal CI environment.
[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["slab_sweep"]

[tool.coverage.report]
show_missing = true
fail_under = 80
