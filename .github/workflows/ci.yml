name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Static checks (ruff + mypy, via pinned pre-commit hooks)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Test
        run: pytest --cov --cov-report=term-missing

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slab-sweep-dist
          path: dist/*
      # To publish to PyPI on a tag, add a release-triggered job here with a PyPI token
      # (secrets.PYPI_API_TOKEN) or OIDC trusted publishing.
