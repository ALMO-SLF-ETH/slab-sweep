name: Release

# Push a tag vX.Y.Z on main (matching pyproject.toml's version) to publish a release:
#   1. build and check the sdist and wheel,
#   2. create the GitHub release with both files and their SHA-256 sums,
#   3. publish to PyPI (only once the repository variable PUBLISH_TO_PYPI is "true" and PyPI
#      trusted publishing is set up for this workflow and the "pypi" environment),
#   4. tell slab-qgis, so it opens a pull request bumping its bundled engine (only if the secret
#      SLAB_QGIS_DISPATCH_TOKEN is set; otherwise slab-qgis notices on its daily check).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        id: version
        run: |
          python - <<'PY'
          import os, re, tomllib, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = pathlib.Path("src/slab_sweep/__init__.py").read_text()
          code = re.search(r'__version__ = "([^"]+)"', init).group(1)
          assert declared == code, f"pyproject {declared} != __version__ {code}"
          assert tag == f"v{declared}", f"tag {tag} does not match version {declared}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={declared}\n")
          PY
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          name: slab-sweep ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/slab-sweep/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  notify-slab-qgis:
    name: Ask slab-qgis to bump its bundled engine
    needs: [build, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          TOKEN: ${{ secrets.SLAB_QGIS_DISPATCH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SLAB_QGIS_DISPATCH_TOKEN not set; slab-qgis picks the release up on its daily check."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ALMO-SLF-ETH/slab-qgis/dispatches \
            -d "{\"event_type\": \"slab-sweep-released\", \"client_payload\": {\"version\": \"$VERSION\"}}"
