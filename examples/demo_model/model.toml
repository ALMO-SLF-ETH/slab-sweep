# Demo model manifest -- for trying the plugin's Run page by hand.
# `{python}` is the interpreter that runs the model (QGIS's Python when launched from the
# plugin) and `{model_dir}` is this folder, so the manifest works wherever it is checked out.

[model]
name = "demo"
version = "0.1.0"
schema = "1.2"
description = "Slow demo model: reports progress, writes a constant-value raster."

[invocation]
command = ["{python}", "{model_dir}/run.py"]
args_template = ["--runspec", "{runspec}"]
timeout_s = 120

[params.level]
type = "float"
unit = "m"
default = 1.0
min = 0.0
max = 10.0
sweepable = true
description = "Constant value written into the output raster."

[outputs.field]
kind = "raster"
format = "GTiff"
description = "A constant field equal to 'level'."
